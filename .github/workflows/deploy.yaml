name: Infrastructure & Configuration Automation Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform-ci:
    name: Lint, Format and Plan
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
      TF_VAR_initial_app_secret_value: ${{secrets.APP_SECRET }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
      TF_RENAME_PROVIDERS: "1" # Instructs TF to automatically align provider namespaces if needed

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Install and Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0 # Upgraded to native stable version supporting new GPG key rings

      - name: Validate Terraform Syntax Format
        run: terraform -chdir=terraform fmt -check

      - name: Initialize Working Directory
        run: terraform -chdir=terraform init

      - name: Generate Speculative Execution Plan
        run: terraform -chdir=terraform plan -var="aws_key_pair_name=dummy-key"

  deploy-dev:
    name: Apply Infrastructure & Run Configuration
    needs: terraform-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
      AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
      TF_VAR_initial_app_secret_value: ${{secrets.APP_SECRET}}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Configure SSH Private Key File
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install and Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Initialize Working Directory
        run: terraform -chdir=terraform init

      - name: Target Live Architecture Synchronization
        id: apply
        run: terraform -chdir=terraform apply -auto-approve -var="aws_key_pair_name=${{ secrets.AWS_KEY_PAIR_NAME }}"

      - name: Extract Live Deployment Endpoint Strings
        id: tf_outputs
        run: |
          cd terraform
          echo "TARGET_IP=$(terraform output -raw instance_public_ip)" >> $GITHUB_ENV
          echo "ALB_URL=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV

      - name: Fetch Secret Out of Band from AWS SSM Parameter Store
        run: |
          FETCHED_SECRET=$(aws ssm get-parameter --name "/dev/rewards/APP_SECRET" --with-decryption --query "Parameter.Value" --output text)
          echo "FETCHED_APP_SECRET=$FETCHED_SECRET" >> $GITHUB_ENV

      - name: Set up Python for Ansible Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Active Ansible Engine Dependency
        run: pip install ansible

      - name: Run Ansible Playbook Orchestration
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd ansible
          echo "${{ env.TARGET_IP }}" > hosts.ini
          ansible-playbook -i hosts.ini playbook.yml -u ubuntu --private-key ~/.ssh/id_rsa

      - name: Execute End-to-End Delivery Smoke Verification
        run: |
          echo "Verifying service delivery..."
          curl --retry 5 --retry-delay 5 -v http://${{ env.ALB_URL }}/health
