name: Infrastructure & Configuration Automation Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform-ci:
    name: Lint, Format and Plan
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_initial_app_secret_value: ${{ secrets.APP_SECRET }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Plan
        run: terraform -chdir=terraform plan -var="aws_key_pair_name=dummy-key"


  deploy-dev:
    name: Apply Infrastructure & Configure EC2 via SSM
    needs: terraform-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      # ✅ AWS credentials (required for SSM + Terraform outputs)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve -var="aws_key_pair_name=${{ secrets.AWS_KEY_PAIR_NAME }}"

      # ✅ Get outputs from Terraform
      - name: Get Terraform Outputs
        run: |
          cd terraform
          echo "ALB_URL=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV

      # ✅ SSM: Install + configure nginx (Fixed Syntax)
      - name: Configure EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Install nginx + configure health endpoint" \
            --parameters 'commands=[
              "set -e",
              "sudo apt update -y",
              "sudo apt install -y nginx",
              "sudo systemctl enable nginx",
              "sudo systemctl start nginx",
              "sudo mkdir -p /var/www/rewards",
              "echo \"{\\\"service\\\":\\\"rewards\\\",\\\"status\\\":\\\"ok\\\",\\\"commit\\\":\\\"'"$GITHUB_SHA"'\\\",\\\"region\\\":\\\"af-south-1\\\"}\" | sudo tee /var/www/rewards/health",
              "sudo rm -f /etc/nginx/sites-enabled/default",
              "echo \"server { listen 80; server_name _; location /health { default_type application/json; alias /var/www/rewards/health; } }\" | sudo tee /etc/nginx/sites-available/rewards > /dev/null",
              "sudo ln -sf /etc/nginx/sites-available/rewards /etc/nginx/sites-enabled/rewards",
              "sudo nginx -t",
              "sudo systemctl restart nginx"
            ]'

      # ✅ Smoke test via ALB
      - name: Smoke Test Health Endpoint
        run: |
          echo "Testing ALB: ${{ env.ALB_URL }}"
          curl --retry 10 --retry-delay 5 http://${{ env.ALB_URL }}/health
