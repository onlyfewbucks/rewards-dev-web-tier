---
- name: Configure Dev Web Tier Components
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache and install baseline packages
      apt:
        name:
          - nginx
          - ufw
          - curl
          - awscli
          - amazon-cloudwatch-agent
        state: present
        update_cache: yes

    - name: Apply UFW firewall security baseline
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Enable UFW firewall
      ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Ensure Nginx app configuration directory exists
      file:
        path: /var/www/rewards
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy the health JSON landing file
      copy:
        dest: /var/www/rewards/health
        content: |
          {"service":"rewards","status":"ok","commit":"{{ lookup('env', 'GITHUB_SHA') | default('local-dev', true) }}","region":"{{ aws_region }}"}
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Template Nginx server block configuration
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/rewards
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx

    - name: Enable Nginx rewards configuration site
      file:
        src: /etc/nginx/sites-available/rewards
        dest: /etc/nginx/sites-enabled/rewards
        state: link

    - name: Remove default Nginx site configuration link
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Create secure directory for app secrets
      file:
        path: /etc/rewards
        state: directory
        owner: root
        group: www-data
        mode: '0750'

    - name: Load APP_SECRET to secure server location
      copy:
        dest: /etc/rewards/secret.env
        content: "APP_SECRET={{ app_secret_env_var }}"
        owner: root
        group: www-data
        mode: '0640'
      no_log: true
      notify: Restart Nginx

    - name: Create Nginx systemd override for secrets
      copy:
        dest: /etc/systemd/system/nginx.service.d/override.conf
        content: |
          [Service]
          EnvironmentFile=/etc/rewards/secret.env
        owner: root
        group: root
        mode: '0644'
      notify: Restart Nginx

    - name: Configure CloudWatch agent for log streaming
      template:
        src: templates/cloudwatch-config.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable CloudWatch agent
      systemd:
        name: amazon-cloudwatch-agent
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Configure log rotation for NGINX
      copy:
        dest: /etc/logrotate.d/nginx
        content: |
          /var/log/nginx/*.log {
            daily
            rotate 7
            compress
            delaycompress
            notifempty
            create 0640 www-data adm
            sharedscripts
            postrotate
              if systemctl is-active --quiet nginx; then
                systemctl reload nginx > /dev/null 2>&1
              fi
            endscript
          }
        owner: root
        group: root
        mode: '0644'

    - name: Enable Nginx service and ensure it starts on reboot
      systemd:
        name: nginx
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Harden Nginx configuration
      lineinfile:
        path: /etc/nginx/nginx.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^\\s*#?\\s*server_tokens", line: "    server_tokens off;" }
        - { regexp: "^\\s*#?\\s*client_max_body_size", line: "    client_max_body_size 1m;" }
      notify: Restart Nginx

    - name: Verify NGINX configuration
      command: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0
      changed_when: false

  handlers:
    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
